# =============================================================================
# Zen-O Daily Check-in — GitHub Actions Workflow
# =============================================================================
# Triggers daily at 00:17 UTC (08:17 UTC+8), within the 08:00–10:00 window.
# ⚠️ 不要在脚本内 sleep — 那会消耗 GitHub Actions 免费额度。
#    私库 2000 min/月，sleep 1h × 30天 = 1800 min，几乎用光。
#    改为 cron 直接定在目标窗口内，执行只要 ~10 秒。
#
# Required repository secrets:
#   ZENO_AUTH_TOKEN    — your Bearer token (see README for how to get it)
# Optional secrets:
#   DISCORD_WEBHOOK_URL — Discord webhook URL for notifications
# =============================================================================

name: zeno-daily-checkin

on:
  schedule:
    # 00:17 UTC = 08:17 UTC+8，落在 08:00–10:00 窗口内
    # 选 17 分而非整点/半点，避开 cron 拥堵
    - cron: '17 0 * * *'
  # Allow manual trigger from the Actions tab for testing
  workflow_dispatch:

jobs:
  checkin:
    name: Daily Check-in
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Validate secrets
        run: |
          if [ -z "${{ secrets.ZENO_AUTH_TOKEN }}" ]; then
            echo "::error::ZENO_AUTH_TOKEN secret is not set."
            echo "::error::Go to Settings → Secrets and variables → Actions to add it."
            exit 1
          fi
          echo "ZENO_AUTH_TOKEN is configured ✓"
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "DISCORD_WEBHOOK_URL is configured ✓"
          else
            echo "DISCORD_WEBHOOK_URL not set — Discord notifications disabled"
          fi

      - name: ✅ Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          echo "jq $(jq --version) installed ✓"

      - name: 🎲 Run daily check-in
        id: checkin
        run: |
          bash scripts/zeno-checkin.sh
        env:
          ZENO_AUTH_TOKEN: ${{ secrets.ZENO_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: 📋 Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════"
          echo "  Zen-O Check-in completed"
          echo "  Time: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "═══════════════════════════════════════════"